[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "d2wm-parser"
version = "0.1.0"
requires-python = ">=3.13"

[tool.maturin]
bindings = "pyo3"
module-name = "d2wm_parser"
include = [
    { path = "d2wm_parser/__init__.py", format = "wheel" },
    { path = "d2wm_parser/__init__.pyi", format = "wheel" },
    { path = "d2wm_parser/py.typed", format = "wheel" },
]
