name: dota2wardmap-back

x-backend: &backend
  build: .
  stop_grace_period: 2m
  environment:
    DB_URL: postgresql+psycopg2://${POSTGRES_USER:-dota2wardmap}:${POSTGRES_PASSWORD:-dota2wardmap}@postgres:5432/${POSTGRES_DB:-dota2wardmap}
    REDIS_URL: redis://redis:6379/0
    OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
    OPENDOTA_API_URL: ${OPENDOTA_API_URL:-https://api.opendota.com/api}
    OPENDOTA_TIMEOUT: ${OPENDOTA_TIMEOUT:-30}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    PARSER_WORKERS: ${PARSER_WORKERS:-4}
    COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-300}
    JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-7}
    JOB_CLEANUP_INTERVAL_SECONDS: ${JOB_CLEANUP_INTERVAL_SECONDS:-3600}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://rupas1k.github.io,https://wardmap.rupasov.dev}
    ANONYMOUS_RATE_LIMIT_PER_MINUTE: ${ANONYMOUS_RATE_LIMIT_PER_MINUTE:-60}
    AUTHENTICATION_FAILURE_RATE_LIMIT_PER_MINUTE: ${AUTHENTICATION_FAILURE_RATE_LIMIT_PER_MINUTE:-30}
    ADVANCED_RATE_LIMIT_PER_MINUTE: ${ADVANCED_RATE_LIMIT_PER_MINUTE:-600}
    ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-0}
    ANONYMOUS_MAX_WARD_PAGE_SIZE: ${ANONYMOUS_MAX_WARD_PAGE_SIZE:-5000}
    ADVANCED_MAX_WARD_PAGE_SIZE: ${ADVANCED_MAX_WARD_PAGE_SIZE:-5000}
    ADMIN_MAX_WARD_PAGE_SIZE: ${ADMIN_MAX_WARD_PAGE_SIZE:-10000}
    MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    RUST_BACKTRACE: "full"

services:
  api:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *backend
    command:
      - /bin/sh
      - -c
      - |
        exec flask --app dota2wardmap:create_app db upgrade
    depends_on:
      postgres:
        condition: service_healthy

  match-collector:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "dota2wardmap.replay.collector"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  replay-worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "dota2wardmap.replay.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dota2wardmap}
      POSTGRES_USER: ${POSTGRES_USER:-dota2wardmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dota2wardmap}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dota2wardmap} -d ${POSTGRES_DB:-dota2wardmap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-restore:
    image: postgres:17
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dota2wardmap}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dota2wardmap}
      POSTGRES_DB: ${POSTGRES_DB:-dota2wardmap}
    volumes:
      - ${POSTGRES_RESTORE_PATH:-../dota2wardmap-2026-08-25.dump}:/backup/database.dump:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql --dbname postgres --set ON_ERROR_STOP=1 --set db_name="$$POSTGRES_DB" <<'SQL'
        SELECT pg_terminate_backend(pid)
        FROM pg_stat_activity
        WHERE datname = :'db_name' AND pid <> pg_backend_pid();
        DROP DATABASE IF EXISTS :"db_name";
        CREATE DATABASE :"db_name";
        SQL
        pg_restore \
          --dbname "$$POSTGRES_DB" \
          --exit-on-error \
          --no-owner \
          --no-privileges \
          /backup/database.dump

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
