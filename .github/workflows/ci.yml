name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - run: cargo +stable build --package wardmap-parser --target wasm32-unknown-unknown --lib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff pyright
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python -m pytest
