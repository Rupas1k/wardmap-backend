query GetLeagueMatches($leagueId: Int!, $take: Int!, $skip: Int!){
    league(id: $leagueId) {
        matches(request: {take: $take, skip: $skip}) {
            id
            leagueId
            tournamentId
            didRadiantWin
            gameVersionId
            radiant_networth_lead: radiantNetworthLeads
            durationSeconds
            players {
                matchId
                playerSlot
                steamAccountId
                isRadiant
            }
            playbackData {
                wardEvents {
                    indexId
                    fromPlayer # playerSlot
                    wardType
                    action
                    playerDestroyed
                    positionX
                    positionY
                    time
                }
            }
        }
    }
}
